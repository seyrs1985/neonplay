<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a18">
<title>Neon Blackjack — Free Strategy Coach 21</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="chip"><span class="lb" id="lb-chips"></span><b id="v-chips">1000</b></div>
    <div class="chip"><span class="lb" id="lb-bet"></span><b id="v-bet">0</b></div>
    <span id="handNo"></span>
    <button id="tab-classic" class="tab">CLASSIC</button>
    <button id="tab-daily" class="tab on">DAILY 20</button>
    <button id="coachBtn" class="pill wide">💡 COACH</button>
    <button id="muteBtn" class="pill" aria-label="mute">🔊</button>
  </div>
  <div id="table">
    <div class="row"><div class="zoneLabel">DEALER <b id="dealerVal"></b></div><div id="dealerCards" class="cards"></div></div>
    <div id="banner" class="banner"></div>
    <div id="coach" class="coach"></div>
    <div class="row"><div class="zoneLabel">YOU <b id="playerVal"></b></div><div id="playerCards" class="cards"></div></div>
    <div id="betBtns" class="btns">
      <button id="chip10" class="chipbtn">+10</button>
      <button id="chip25" class="chipbtn">+25</button>
      <button id="chip50" class="chipbtn">+50</button>
      <button id="chip100" class="chipbtn">+100</button>
      <button id="clearBtn" class="chipbtn ghost"></button>
      <button id="btnDeal" class="primary"></button>
    </div>
    <div id="actionBtns" class="btns">
      <button id="btnHit" class="act hit"></button>
      <button id="btnStand" class="act stand"></button>
      <button id="btnDouble" class="act dbl"></button>
    </div>
    <button id="nextBtn" class="primary hide"></button>
  </div>
  <div id="foot"><span id="funOnly"></span><span id="stats"></span></div>
  <div id="panel" class="overlay hide"><div id="panelBox" class="panel"></div></div>
</div>
<script src="np_core.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
