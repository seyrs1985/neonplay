<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a18">
<title>Neon Link</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="topbar">
    <button id="tab-casual" class="tab"></button>
    <button id="tab-standard" class="tab"></button>
    <button id="tab-daily" class="tab"></button>
  </div>
  <div id="hud">
    <span class="stat"><b id="timer">0:00</b></span>
    <span class="stat"><b id="scoreV">0</b></span>
    <span class="stat"><b id="leftV">30</b></span>
    <span id="comboPill" class="combo hide">×1</span>
    <button id="hintBtn" class="pill"></button>
    <button id="shuffleBtn" class="pill"></button>
    <button id="muteBtn" class="pill">🔊</button>
  </div>
  <div id="boardWrap">
    <div id="grid"></div>
    <svg id="links" aria-hidden="true"></svg>
    <div id="fx" aria-hidden="true"></div>
  </div>
  <div id="msg"></div>
</div>
<div id="endPanel" class="overlay hide">
  <div class="panel">
    <h2 id="epTitle"></h2>
    <div id="epRank"></div>
    <div id="epRows"></div>
    <p id="epNote"></p>
    <canvas id="shareCanvas" width="480" height="280" class="hide"></canvas>
    <button id="epShare"></button>
    <button id="epRetry"></button>
  </div>
</div>
<script src="np_core.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
