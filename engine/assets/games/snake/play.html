<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 0%,#131c3f 0%,#0b1020 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#e2e8f0;touch-action:none;overflow:hidden}
#hud{display:flex;gap:12px;margin-bottom:12px}
#hud .chip{background:rgba(20,26,53,.85);border:1px solid #2b3564;border-radius:999px;padding:6px 16px;font-size:.95rem;display:flex;gap:6px;align-items:center}
#hud .chip b{color:#4ade80;text-shadow:0 0 8px rgba(74,222,128,.6)}
#hud .chip b.gold{color:#facc15;text-shadow:0 0 8px rgba(250,204,21,.6)}
canvas{border-radius:12px;max-width:96vw;max-height:70vh;box-shadow:0 0 32px rgba(34,211,238,.18),0 8px 40px rgba(0,0,0,.5)}
#msg{margin-top:10px;font-size:.85rem;color:#7c8db5;text-align:center;letter-spacing:.4px}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,25,.86);backdrop-filter:blur(3px);text-align:center}
#over h2{font-size:1.7rem;margin:0 0 6px;background:linear-gradient(135deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
#over p{margin:0 0 16px;color:#94a3b8}
#over p b{color:#4ade80;font-size:1.2rem}
#over button{font:inherit;font-weight:700;padding:11px 28px;border:0;border-radius:10px;background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#0b1020;cursor:pointer;box-shadow:0 0 18px rgba(34,211,238,.4)}
</style>
</head>
<body>
<div id="hud">
  <div class="chip"><span id="lb-score">SCORE</span> <b id="sc">0</b></div>
  <div class="chip"><span id="lb-best">BEST</span> <b id="bs" class="gold">0</b></div>
</div>
<canvas id="cv" width="441" height="441"></canvas>
<div id="msg">arrow keys / WASD — swipe on mobile</div>
<div id="over"><h2 id="lb-over">GAME OVER</h2><p><span id="lb-fs">score</span> <b id="fs">0</b></p><button id="rb">Play again</button></div>
<script src="np_core.js"></script>
<script>
var L={zh:{score:"得分",best:"最佳",msg:"方向键 / WASD — 手机滑动",over:"游戏结束",fsLabel:"得分",again:"再来一局"},en:{score:"SCORE",best:"BEST",msg:"arrow keys / WASD — swipe on mobile",over:"GAME OVER",fsLabel:"score",again:"Play again"}};
var lang=npLang();
var t=function(k){return npT(L,k)};
'use strict';
const N=21,S=21,W=N*S;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=W*dpr;
let snake,dir,queue,apple,score,dead,timer,acc,best=0,shake=0,flash=0,t0=performance.now();
let particles=[],floats=[],stars=[];
for(let i=0;i<42;i++)stars.push({x:Math.random()*W,y:Math.random()*W,r:Math.random()*1.3+.4,tw:Math.random()*6.28});

function reset(){
  snake=[{x:10,y:12},{x:10,y:13},{x:10,y:14}];
  dir={x:0,y:-1};queue=[];score=0;dead=false;acc=0;particles=[];floats=[];shake=0;flash=0;
  placeApple();hud();
  document.getElementById('over').style.display='none';
  clearInterval(timer);timer=setInterval(tick,110);
}
function hud(){document.getElementById('sc').textContent=score;document.getElementById('bs').textContent=best;
  document.getElementById('fs').textContent=score;}
function placeApple(){
  do{apple={x:(Math.random()*N)|0,y:(Math.random()*N)|0};}
  while(snake.some(s=>s.x===apple.x&&s.y===apple.y));
}
function burst(x,y,color,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,sp=1+Math.random()*2.6;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.6,life:1,color:color});
  }
}
function pop(x,y,txt,color){floats.push({x:x,y:y,txt:txt,life:1,color:color});}
function tick(){
  if(dead)return;
  if(queue.length){const n=queue.shift();if(n.x!==-dir.x||n.y!==-dir.y)dir=n;}
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){die();return;}
  snake.unshift(h);
  if(h.x===apple.x&&h.y===apple.y){
    score+=10;if(score>best)best=score;hud();
    burst(apple.x*S+S/2,apple.y*S+S/2,'#facc15',14);
    burst(apple.x*S+S/2,apple.y*S+S/2,'#4ade80',8);
    pop(apple.x*S+S/2,apple.y*S,'+10','#facc15');
    placeApple();
  }
  else snake.pop();
}
function die(){
  dead=true;shake=14;flash=.55;clearInterval(timer);
  snake.forEach(function(s,i){burst(s.x*S+S/2,s.y*S+S/2,i?'#4ade80':'#a7f3d0',3);});
  setTimeout(function(){
    hud();
    document.getElementById('over').style.display='flex';
  },520);
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  var t=(performance.now()-t0)/1000;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;if(shake<.3)shake=0;}
  // 背景: 深空渐变 + 呼吸星点 + 微网格
  var g=ctx.createLinearGradient(0,0,0,W);
  g.addColorStop(0,'#141d42');g.addColorStop(1,'#0b1020');
  ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,W+20);
  stars.forEach(function(s){
    ctx.globalAlpha=.35+.3*Math.sin(t*1.4+s.tw);
    ctx.fillStyle='#c7d4ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  });
  ctx.globalAlpha=.06;ctx.strokeStyle='#22d3ee';ctx.lineWidth=1;
  for(var i=1;i<N;i++){
    ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,W);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*S);ctx.lineTo(W,i*S);ctx.stroke();
  }
  ctx.globalAlpha=1;
  // 边框辉光
  ctx.strokeStyle='rgba(34,211,238,.35)';ctx.lineWidth=2;
  ctx.strokeRect(1,1,W-2,W-2);
  // 苹果: 脉动红果 + 光晕
  var pulse=1+0.10*Math.sin(t*5);
  var ax=apple.x*S+S/2,ay=apple.y*S+S/2;
  ctx.shadowColor='#f87171';ctx.shadowBlur=16;
  ctx.fillStyle='#f87171';ctx.beginPath();ctx.arc(ax,ay,(S/2-3)*pulse,0,7);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(ax-3,ay-4,2.2,0,7);ctx.fill();
  // 蛇: 渐变霓虹体 + 圆角 + 辉光
  for(var i=snake.length-1;i>=0;i--){
    var s=snake[i],k=1-i/snake.length;
    var r0=Math.round(74+40*(1-k)),g0=Math.round(222-40*(1-k)),b0=Math.round(128-40*(1-k));
    var col='rgb('+r0+','+g0+','+b0+')';
    ctx.shadowColor=i===0?'#a7f3d0':col;ctx.shadowBlur=i===0?16:8;
    ctx.fillStyle=col;
    rr(s.x*S+1.5,s.y*S+1.5,S-3,S-3,6);ctx.fill();
    ctx.shadowBlur=0;
  }
  // 眼睛(朝向运动方向)
  var hd=snake[0],cx=hd.x*S+S/2,cy=hd.y*S+S/2;
  var px=-dir.y,py=dir.x,fx=dir.x*4.5,fy=dir.y*4.5;
  ctx.fillStyle='#0b1020';
  ctx.beginPath();ctx.arc(cx+fx+px*4.2,cy+fy+py*4.2,2.3,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(cx+fx-px*4.2,cy+fy-py*4.2,2.3,0,7);ctx.fill();
  // 粒子
  particles=particles.filter(function(p){return p.life>0;});
  particles.forEach(function(p){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life-=.03;
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;ctx.fillRect(p.x-1.6,p.y-1.6,3.2,3.2);
  });
  ctx.globalAlpha=1;
  // 飘字
  floats=floats.filter(function(f){return f.life>0;});
  floats.forEach(function(f){
    f.y-=.8;f.life-=.022;
    ctx.globalAlpha=Math.max(0,f.life);
    ctx.fillStyle=f.color;ctx.font='bold 16px system-ui';ctx.textAlign='center';
    ctx.shadowColor=f.color;ctx.shadowBlur=8;
    ctx.fillText(f.txt,f.x,f.y);ctx.shadowBlur=0;
  });
  ctx.globalAlpha=1;
  // 死亡红闪
  if(flash>0){ctx.fillStyle='rgba(239,68,68,'+flash+')';ctx.fillRect(-10,-10,W+20,W+20);flash-=.04;}
  ctx.restore();
}
function loop(){draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
function turn(x,y){queue.push({x,y});}
const K={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown',e=>{
  if(dead){if(e.key===' '||e.key==='Enter')reset();return;}
  const k=K[e.key]||K[e.key.toLowerCase&&e.key.toLowerCase()];
  if(k){e.preventDefault();turn(k[0],k[1]);}
});
let tx=null,ty=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  if(dead){reset();return;}
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy));tx=null;
},{passive:true});
document.getElementById('rb').addEventListener('click',reset);
document.getElementById("lb-score").textContent=t("score");
document.getElementById("lb-best").textContent=t("best");
document.getElementById("msg").textContent=t("msg");
document.getElementById("lb-over").textContent=t("over");
document.getElementById("lb-fs").textContent=t("fsLabel");
document.getElementById("rb").textContent=t("again");
reset();
</script>
</body>
</html>
