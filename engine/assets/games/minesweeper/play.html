<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Minesweeper</title>
<style>
  html,body{margin:0;padding:0;min-height:100%;background:radial-gradient(120% 90% at 50% 0%,#141d42 0%,#0a0a18 70%);color:#e2e8f0;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative}
  /* 深空星点层 */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%,rgba(199,212,255,.8),transparent 60%),
      radial-gradient(1px 1px at 34% 68%,rgba(199,212,255,.55),transparent 60%),
      radial-gradient(1.8px 1.8px at 58% 14%,rgba(0,229,255,.5),transparent 60%),
      radial-gradient(1px 1px at 72% 48%,rgba(199,212,255,.6),transparent 60%),
      radial-gradient(1.4px 1.4px at 88% 78%,rgba(124,77,255,.5),transparent 60%),
      radial-gradient(1px 1px at 22% 86%,rgba(199,212,255,.5),transparent 60%),
      radial-gradient(1.6px 1.6px at 46% 38%,rgba(255,45,149,.4),transparent 60%),
      radial-gradient(1px 1px at 92% 26%,rgba(199,212,255,.55),transparent 60%);
    animation:twinkle 4s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.45}to{opacity:.95}}
  #hud{display:flex;gap:18px;align-items:center;margin:10px 0;font-size:15px;font-weight:700}
  #hud .box{background:#141a35;border:1px solid #2b3564;border-radius:8px;padding:6px 12px;min-width:64px;text-align:center;transition:transform .15s}
  #hud .box.bump{transform:scale(1.12)}
  #hud .box span{text-shadow:0 0 8px rgba(0,229,255,.35)}
  #flagBtn{background:#141a35;border:1px solid #2b3564;border-radius:8px;color:#e2e8f0;
    font-size:15px;font-weight:700;min-height:44px;padding:6px 14px;cursor:pointer;
    transition:background .15s,border-color .15s,transform .12s,box-shadow .2s}
  #flagBtn:hover{border-color:rgba(0,229,255,.5)}
  #flagBtn:active{transform:scale(.93)}
  #flagBtn.on{background:#7c4dff;border-color:#9f7dff;color:#fff;box-shadow:0 0 14px rgba(124,77,255,.55)}
  #grid{position:relative;display:grid;grid-template-columns:repeat(9,1fr);gap:3px;background:rgba(20,26,53,.85);
    padding:8px;border-radius:12px;border:1px solid rgba(0,229,255,.22);
    box-shadow:0 0 32px rgba(0,229,255,.14),0 10px 40px rgba(0,0,0,.5);width:min(92vw,396px)}
  #grid.shake{animation:bshake .5s ease-out}
  @keyframes bshake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .cell{aspect-ratio:1;border:0;border-radius:5px;background:#232b52;color:#e2e8f0;
    font-size:clamp(13px,3.4vw,17px);font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;user-select:none;padding:0;
    transition:background .15s,transform .1s}
  .cell:hover:not(.open){background:#2d3768;transform:scale(1.05)}
  .cell.open{animation:reveal .18s ease-out;background:#101532;cursor:default;border:1px solid #1c2450}
  @keyframes reveal{from{transform:scale(.8);opacity:.4}to{transform:scale(1);opacity:1}}
  .cell.mine{background:#7f1d1d}
  .cell.mine,.cell.boom{animation:minein .3s ease-out both}
  @keyframes minein{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .cell.boom{background:#dc2626;animation:cellboom .5s ease}
  @keyframes cellboom{0%{transform:scale(1)}35%{transform:scale(1.4)}100%{transform:scale(1)}}
  .cell.flag{background:#3b2f7a}
  .cell.flagpop{animation:flagpop .3s ease-out}
  @keyframes flagpop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .n1{color:#7dd3fc}.n2{color:#4ade80}.n3{color:#fca5a5}.n4{color:#c4b5fd}
  .n5{color:#fbbf24}.n6{color:#67e8f9}.n7{color:#f472b6}.n8{color:#e2e8f0}
  .n1,.n2,.n3,.n4,.n5,.n6,.n7,.n8{text-shadow:0 0 7px currentColor}
  /* 胜利彩带 */
  .cf{position:absolute;top:-4%;width:7px;height:11px;border-radius:2px;pointer-events:none;z-index:5;
    animation:cfall 1s ease-in forwards}
  @keyframes cfall{0%{transform:translate(0,0) rotate(0);opacity:1}
    100%{transform:translate(var(--dx),52vh) rotate(540deg);opacity:0}}
  /* 踩雷红闪 */
  #flash{position:fixed;inset:0;pointer-events:none;background:#dc2626;opacity:0;z-index:8}
  #flash.go{animation:redflash .55s ease-out}
  @keyframes redflash{0%{opacity:.4}100%{opacity:0}}
  #msg{min-height:22px;margin:10px 0;font-size:14px;text-align:center;padding:0 10px}
  #msg.wintext{background:linear-gradient(135deg,#facc15,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;
    animation:msgdrop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes msgdrop{from{transform:translateY(-16px) scale(.8);opacity:0}to{transform:none;opacity:1}}
  /* 翻格火花 */
  #grid .spark{position:absolute;width:5px;height:5px;margin:-2.5px;border-radius:50%;pointer-events:none;z-index:5;
    animation:sparkfly .45s ease-out forwards}
  @keyframes sparkfly{0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
  #again{min-height:44px;padding:9px 24px;font-size:14px;font-weight:700;border:0;border-radius:8px;
    background:linear-gradient(135deg,#00e5ff,#7c4dff);color:#0a0a18;cursor:pointer;
    margin-bottom:12px;visibility:hidden;box-shadow:0 0 16px rgba(0,229,255,.4);
    transition:transform .15s ease-out,box-shadow .2s}
  #again:hover{transform:scale(1.06);box-shadow:0 0 24px rgba(0,229,255,.65)}
  #again:active{transform:scale(.94)}
  #again.popin{animation:btnin .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes btnin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="hud">
  <div class="box" id="mineBox">💣 <span id="mines">10</span></div>
  <button id="flagBtn">🚩 <span id="flagLbl"></span></button>
  <div class="box">⏱ <span id="time">0</span>s</div>
</div>
<div id="grid"></div>
<div id="msg"></div>
<button id="again">↻ <span id="againLbl"></span></button>
<div id="flash"></div>
<script src="np_core.js"></script>
<script>
(function(){
"use strict";
/* i18n — np_core.js (np_lang 与站点切换器共用) */
var L={
en:{flagOn:"Flag: ON",flagOff:"Flag: OFF",lose:"💥 Boom! Tap replay.",win:"🏆 Cleared in {s}s!",again:"Play again"},
zh:{flagOn:"旗标:开",flagOff:"旗标:关",lose:"💥 踩雷了！点再来一局。",win:"🏆 扫雷成功！用时 {s} 秒。",again:"再来一局"},
es:{flagOn:"Bandera: SÍ",flagOff:"Bandera: NO",lose:"💥 ¡Boom! Toca para repetir.",win:"¡🏆 Despejado en {s} s!",again:"Jugar de nuevo"},
pt:{flagOn:"Bandeira: SIM",flagOff:"Bandeira: NÃO",lose:"💥 Boom! Toque para repetir.",win:"🏆 Limpo em {s} s!",again:"Jogar de novo"},
ru:{flagOn:"Флажок: ВКЛ",flagOff:"Флажок: ВЫКЛ",lose:"💥 Бум! Нажмите ещё раз.",win:"🏆 Очищено за {s} с!",again:"Играть снова"},
ja:{flagOn:"旗モード:ON",flagOff:"旗モード:OFF",lose:"💥 爆発！タップでリプレイ。",win:"🏆 {s} 秒でクリア！",again:"もう一度遊ぶ"},
ko:{flagOn:"깃발: 켜짐",flagOff:"깃발: 꺼짐",lose:"💥 펑! 다시 눌러 재도전.",win:"🏆 {s}초 만에 클리어!",again:"다시 플레이"},
de:{flagOn:"Fahne: AN",flagOff:"Fahne: AUS",lose:"💥 Boom! Zum Wiederholen tippen.",win:"🏆 In {s} s geräumt!",again:"Nochmal spielen"},
fr:{flagOn:"Drapeau : OUI",flagOff:"Drapeau : NON",lose:"💥 Boum ! Tape pour rejouer.",win:"🏆 Déminé en {s} s !",again:"Rejouer"},
id:{flagOn:"Bendera: AKTIF",flagOff:"Bendera: MATI",lose:"💥 Boom! Ketuk untuk ulang.",win:"🏆 Bersih dalam {s} dtk!",again:"Main lagi"}};
var _t=function(k){return npT(L,k)};

var N=9,MINES=10;
var gridEl=document.getElementById("grid"),minesEl=document.getElementById("mines"),
    timeEl=document.getElementById("time"),msgEl=document.getElementById("msg"),
    againB=document.getElementById("again"),flagB=document.getElementById("flagBtn"),
    flashEl=document.getElementById("flash"),mineBox=document.getElementById("mineBox");
document.getElementById("flagLbl").textContent=_t("flagOff");
document.getElementById("againLbl").textContent=_t("again");
var cells,mineSet,state,timer,sec,flagMode,opened,placed;

function idx(r,c){return r*N+c;}
function neighbors(i){
  var r=Math.floor(i/N),c=i%N,out=[];
  for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;
    var nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<N&&nc>=0&&nc<N)out.push(idx(nr,nc));
  }
  return out;
}
function bump(el){
  el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");
  setTimeout(function(){el.classList.remove("bump");},180);
}
/* 程序化音效(零文件,首次手势懒恢复;只读 np_ms_mute) */
var Sound=(function(){
  var ctx=null,master=null,muted=false;
  try{muted=localStorage.getItem("np_ms_mute")==="1";}catch(e){}
  function ensure(){if(ctx)return true;var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    ctx=new AC();master=ctx.createGain();master.gain.value=muted?0:0.35;master.connect(ctx.destination);return true;}
  function resume(){if(ensure()&&ctx.state==="suspended")ctx.resume();}
  function tone(f0,f1,dur,type,vol){if(!ctx||muted)return;try{
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}catch(e){}}
  return {resume:resume,
    open:function(n){tone(340+(n||0)*46,480+(n||0)*46,0.06,"triangle",0.2);},
    flag:function(on){if(on)tone(500,660,0.07,"square",0.16);else tone(660,500,0.07,"square",0.14);},
    boom:function(){tone(160,40,0.6,"sawtooth",0.3);},
    win:function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,f,0.16,"triangle",0.28);},i*110);});}};
})();
/* 翻格火花: 只在点击格上爆一次(不随洪泛区翻倍) */
function sparkAt(i,color){
  var d=gridEl.children[i];if(!d)return;
  var r=d.getBoundingClientRect(),br=gridEl.getBoundingClientRect();
  var x=r.left-br.left+r.width/2,y=r.top-br.top+r.height/2;
  for(var k=0;k<5;k++){
    var s=document.createElement("span");s.className="spark";
    s.style.left=x+"px";s.style.top=y+"px";s.style.background=color;
    s.style.boxShadow="0 0 6px "+color;
    var a=Math.random()*6.28,dist=12+Math.random()*12;
    s.style.setProperty("--dx",(Math.cos(a)*dist).toFixed(1)+"px");
    s.style.setProperty("--dy",(Math.sin(a)*dist).toFixed(1)+"px");
    gridEl.appendChild(s);(function(el){setTimeout(function(){el.remove();},520);})(s);
  }
}
function reset(){
  cells=[];mineSet={};state="idle";sec=0;flagMode=false;opened=0;placed=false;
  flagB.classList.remove("on");document.getElementById("flagLbl").textContent=_t("flagOff");
  minesEl.textContent=MINES;timeEl.textContent="0";msgEl.textContent="";
  msgEl.classList.remove("wintext");
  againB.style.visibility="hidden";
  if(timer){clearInterval(timer);timer=null;}
  gridEl.innerHTML="";
  for(var i=0;i<N*N;i++){
    cells.push({mine:false,open:false,flag:false,n:0});
    var d=document.createElement("button");
    d.className="cell";d.setAttribute("data-i",i);
    gridEl.appendChild(d);
  }
}
function placeMines(safe){
  var pool=[];
  for(var i=0;i<N*N;i++)if(i!==safe&&!neighbors(safe).includes(i))pool.push(i);
  pool.sort(function(){return Math.random()-0.5;});
  for(var m=0;m<MINES;m++){
    mineSet[pool[m]]=true;
    cells[pool[m]].mine=true;
    neighbors(pool[m]).forEach(function(j){cells[j].n++;});
  }
  placed=true;
  timer=setInterval(function(){sec++;timeEl.textContent=sec;},1000);
}
function paint(i){
  var d=gridEl.children[i],c=cells[i];
  d.textContent="";
  d.classList.toggle("open",c.open);
  d.classList.toggle("flag",c.flag&&!c.open);
  if(c.flag&&!c.open)d.textContent="🚩";
  if(c.open&&!c.mine&&c.n>0){
    d.textContent=c.n;d.classList.add("n"+c.n);
  }
}
function confetti(){
  var cols=["#00e5ff","#ff2d95","#facc15","#7c4dff","#4ade80"];
  for(var i=0;i<26;i++){
    var f=document.createElement("span");f.className="cf";
    f.style.left=(4+Math.random()*92)+"%";
    f.style.background=cols[(Math.random()*cols.length)|0];
    f.style.setProperty("--dx",((Math.random()-.5)*90).toFixed(0)+"px");
    f.style.animationDelay=(Math.random()*.35).toFixed(2)+"s";
    gridEl.appendChild(f);
    (function(el){setTimeout(function(){el.remove();},1500);})(f);
  }
}
function reveal(i){
  var c=cells[i];
  if(c.open||c.flag)return;
  Sound.resume();
  if(state==="idle"){placeMines(i);state="play";}
  if(c.mine){lose(i);return;}
  sparkAt(i,"#00e5ff");Sound.open(c.n);
  var stack=[i];
  while(stack.length){
    var j=stack.pop(),cj=cells[j];
    if(cj.open||cj.flag||cj.mine)continue;
    cj.open=true;opened++;paint(j);
    if(cj.n===0)neighbors(j).forEach(function(k){if(!cells[k].open&&!cells[k].flag)stack.push(k);});
  }
  checkWin();
}
function toggleFlag(i){
  if(state==="play"||state==="idle"){
    var c=cells[i];
    if(c.open)return;
    c.flag=!c.flag;paint(i);
    gridEl.children[i].classList.remove("flagpop");void gridEl.children[i].offsetWidth;
    gridEl.children[i].classList.add("flagpop");
    Sound.flag(c.flag);
    var f=cells.filter(function(x){return x.flag;}).length;
    minesEl.textContent=Math.max(0,MINES-f);
    bump(mineBox);
  }
}
function lose(boom){
  state="over";
  if(timer)clearInterval(timer);
  var k=0;
  for(var i=0;i<N*N;i++){
    if(cells[i].mine){
      cells[i].open=true;paint(i);
      gridEl.children[i].classList.add(i===boom?"boom":"mine");
      gridEl.children[i].textContent="💣";
      if(i!==boom)gridEl.children[i].style.animationDelay=(0.12+(k++)*0.05).toFixed(2)+"s";
    }
  }
  gridEl.classList.add("shake");
  setTimeout(function(){gridEl.classList.remove("shake");},550);
  flashEl.classList.remove("go");void flashEl.offsetWidth;flashEl.classList.add("go");
  Sound.boom();
  msgEl.textContent=_t("lose");
  againB.style.visibility="visible";
  againB.classList.remove("popin");void againB.offsetWidth;againB.classList.add("popin");
}
function checkWin(){
  if(opened===N*N-MINES){
    state="won";
    if(timer)clearInterval(timer);
    msgEl.textContent=_t("win").replace("{s}",sec);
    msgEl.classList.remove("wintext");void msgEl.offsetWidth;msgEl.classList.add("wintext");
    confetti();
    Sound.win();
    againB.style.visibility="visible";
    againB.classList.remove("popin");void againB.offsetWidth;againB.classList.add("popin");
  }
}
gridEl.addEventListener("click",function(e){
  var t=e.target.closest(".cell");if(!t)return;
  var i=+t.getAttribute("data-i");
  if(flagMode)toggleFlag(i);else reveal(i);
});
gridEl.addEventListener("contextmenu",function(e){
  e.preventDefault();
  var t=e.target.closest(".cell");if(!t)return;
  toggleFlag(+t.getAttribute("data-i"));
});
var pressT=null;
gridEl.addEventListener("pointerdown",function(e){
  var t=e.target.closest(".cell");if(!t)return;
  var i=+t.getAttribute("data-i");
  pressT=setTimeout(function(){toggleFlag(i);pressT="flagged";},450);
});
gridEl.addEventListener("pointerup",function(){if(pressT){clearTimeout(pressT);pressT=null;}});
gridEl.addEventListener("pointerleave",function(){if(pressT&&pressT!=="flagged")clearTimeout(pressT);});
flagB.addEventListener("click",function(){
  Sound.resume();
  flagMode=!flagMode;
  flagB.classList.toggle("on",flagMode);
  document.getElementById("flagLbl").textContent=_t(flagMode?"flagOn":"flagOff");
});
againB.addEventListener("click",reset);
reset();
})();
</script>
</body>
</html>
