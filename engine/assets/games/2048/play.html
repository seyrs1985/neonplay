<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2048</title>
<style>
html,body{margin:0;min-height:100%;background:radial-gradient(120% 90% at 50% 0%,#141d42 0%,#0b1020 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#e2e8f0;touch-action:none;user-select:none}
#top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
#top .chip{background:rgba(20,26,53,.85);border:1px solid #2b3564;border-radius:999px;padding:6px 16px;font-size:.95rem;display:flex;gap:6px;align-items:center;position:relative;transition:transform .15s}
#top .chip b{color:#facc15;text-shadow:0 0 8px rgba(250,204,21,.5)}
#top .chip.bump{transform:scale(1.12)}
#again{font:inherit;font-weight:700;min-height:44px;padding:8px 18px;border:0;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#0b1020;cursor:pointer;box-shadow:0 0 14px rgba(34,211,238,.3)}
#gain{position:absolute;left:50%;top:-6px;transform:translateX(-50%);color:#4ade80;font-weight:800;
  text-shadow:0 0 8px rgba(74,222,128,.7);pointer-events:none;opacity:0}
#gain.show{animation:rise .7s ease-out}
@keyframes rise{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-26px)}}
#grid{position:relative;background:rgba(20,26,53,.85);border:1px solid rgba(34,211,238,.25);
  box-shadow:0 0 28px rgba(34,211,238,.12),0 10px 40px rgba(0,0,0,.5);
  border-radius:14px;padding:8px;display:grid;grid-template:repeat(4,1fr)/repeat(4,1fr);gap:8px;width:min(92vw,420px);aspect-ratio:1;box-sizing:border-box;
  transition:filter .6s ease}
#grid.dead{filter:grayscale(.75) brightness(.8)}
.cell{position:relative;background:#1b2547;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:clamp(1.1rem,5vw,2rem);text-shadow:0 1px 3px rgba(0,0,0,.45)}
.cell.spawn{animation:spawn .18s ease-out}
@keyframes spawn{from{transform:scale(0)}to{transform:scale(1)}}
.cell.pop{animation:pop .24s ease-out}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
/* 合并爆花: 金色冲击环 + 六向火花 */
.cell.pop::after{content:'';position:absolute;inset:-2px;border-radius:11px;pointer-events:none;
  border:3px solid rgba(250,204,21,.9);animation:ring .45s ease-out forwards}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.55);opacity:0}}
.cell.pop .spark{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;
  background:#fde047;box-shadow:0 0 6px #facc15;pointer-events:none;
  animation:spark .5s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,10,25,.86);backdrop-filter:blur(3px);border-radius:14px;text-align:center;gap:6px;z-index:5;
  animation:fadein .5s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#over h2{margin:0;font-size:1.5rem;background:linear-gradient(135deg,#22d3ee,#f472b6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:drop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{transform:translateY(-40px) scale(.7);opacity:0}to{transform:none;opacity:1}}
#over p{margin:0 0 10px;color:#94a3b8;animation:fadein .5s .25s ease-out both}
#over button{font:inherit;font-weight:700;min-height:44px;padding:11px 26px;border:0;border-radius:10px;
  background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#0b1020;cursor:pointer;
  box-shadow:0 0 16px rgba(34,211,238,.4);animation:fadein .5s .4s ease-out both}
#msg{margin-top:12px;font-size:.85rem;color:#7c8db5;letter-spacing:.4px;text-align:center;padding:0 10px}
/* 达成 2048 彩带 */
.cf{position:fixed;top:-4%;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:30;
  animation:cfall 1.2s ease-in forwards}
@keyframes cfall{0%{transform:translate(0,0) rotate(0);opacity:1}
  100%{transform:translate(var(--dx),58vh) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
.t2{background:#1f2c50;color:#c7d4ff}.t4{background:#1c3a55;color:#a5e3ff}
.t8{background:linear-gradient(135deg,#155e75,#0891b2);color:#fff}
.t16{background:linear-gradient(135deg,#0891b2,#22d3ee);color:#062a33}
.t32{background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff}
.t64{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff}
.t128{background:linear-gradient(135deg,#be185d,#ec4899);color:#fff;box-shadow:0 0 14px rgba(236,72,153,.55)}
.t256{background:linear-gradient(135deg,#db2777,#f472b6);color:#fff;box-shadow:0 0 16px rgba(244,114,182,.6)}
.t512{background:linear-gradient(135deg,#f472b6,#fb923c);color:#fff;box-shadow:0 0 18px rgba(251,146,60,.6)}
.t1024{background:linear-gradient(135deg,#f59e0b,#facc15);color:#3b2f04;box-shadow:0 0 20px rgba(250,204,21,.7)}
.t2048{background:linear-gradient(135deg,#facc15,#fff7cc);color:#3b2f04;box-shadow:0 0 26px rgba(250,204,21,.95)}
.tbig{background:linear-gradient(135deg,#fff,#e0f2fe);color:#0b1020;box-shadow:0 0 30px rgba(255,255,255,.9)}
</style>
</head>
<body>
<div id="top">
  <div class="chip" id="chipSc"><span id="lb-sc">SCORE</span> <b id="sc">0</b><span id="gain"></span></div>
  <div class="chip"><span id="lb-bs">BEST</span> <b id="bs">0</b></div>
  <button id="again">↻ <span id="lb-again">New game</span></button>
</div>
<div id="grid"></div>
<div id="msg">arrow keys / WASD — swipe on mobile · merge to 2048</div>
<script>
'use strict';
/* i18n — np_lang 与站点切换器共用 */
var L={zh:{score:"得分",best:"最佳",again:"新游戏",msg:"方向键 / WASD — 手机滑动方块 · 合成 2048",
  over:"无路可走了",overP:function(s,m){return "得分 "+s+" · 最大方块 "+m;}},
  en:{score:"SCORE",best:"BEST",again:"New game",msg:"arrow keys / WASD — swipe on mobile · merge to 2048",
  over:"No moves left",overP:function(s,m){return "score "+s+" · best tile "+m;}}};
var lang=(localStorage.getItem("np_lang")||"en").slice(0,2);
var t=function(k){return (L[lang]||L.en)[k]||k};
document.getElementById('lb-sc').textContent=t('score');
document.getElementById('lb-bs').textContent=t('best');
document.getElementById('lb-again').textContent=t('again');
document.getElementById('msg').textContent=t('msg');

let grid,score,dead,best=parseInt(localStorage.getItem("np_2048_best")||"0",10)||0,lastGain=0,reached2048=false;
function confettiBurst(){
  var cols=["#facc15","#f472b6","#22d3ee","#a78bfa"];
  for(var i=0;i<34;i++){
    var f=document.createElement("span");f.className="cf";
    f.style.left=(Math.random()*100)+"%";
    f.style.background=cols[(Math.random()*cols.length)|0];
    f.style.setProperty("--dx",((Math.random()-.5)*90).toFixed(0)+"px");
    f.style.animationDelay=(Math.random()*.4).toFixed(2)+"s";
    document.body.appendChild(f);
    (function(el){setTimeout(function(){el.remove();},1800);})(f);
  }
}
const g=document.getElementById('grid');
function reset(){grid=Array.from({length:4},()=>[0,0,0,0]);score=0;dead=false;g.classList.remove('dead');
  const old=g.querySelector('#over');if(old)old.remove();
  const a=add(),b=add();render([],b||a);}
function add(){
  const empty=[];grid.forEach((r,i)=>r.forEach((v,j)=>{if(!v)empty.push([i,j]);}));
  if(!empty.length)return null;
  const [i,j]=empty[(Math.random()*empty.length)|0];
  grid[i][j]=Math.random()<0.9?2:4;
  return [i,j];
}
/* 合并格爆花: 6 粒金色火花随机方向 */
function sparks(d){
  for(let i=0;i<6;i++){
    const s=document.createElement('span');s.className='spark';
    const a=Math.random()*6.28,r=18+Math.random()*16;
    s.style.setProperty('--dx',(Math.cos(a)*r).toFixed(1)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*r).toFixed(1)+'px');
    d.appendChild(s);setTimeout(function(){s.remove();},560);
  }
}
function render(merges,spawn){
  g.querySelectorAll('.cell').forEach(c=>c.remove());
  grid.forEach((r,i)=>r.forEach((v,j)=>{
    const d=document.createElement('div');d.className='cell';
    if(v){
      const c='t'+(v>2048?'big':v);d.classList.add(c.includes(' ')?'tbig':c);d.textContent=v;
      if(merges&&merges.some(m=>m[0]===i&&m[1]===j)){d.classList.add('pop');sparks(d);}
      if(spawn&&spawn[0]===i&&spawn[1]===j)d.classList.add('spawn');
    }
    g.appendChild(d);
  }));
  const sc=document.getElementById('sc');
  sc.textContent=score;
  document.getElementById('bs').textContent=best;
  if(lastGain>0){
    const el=document.getElementById('gain');
    el.textContent='+'+lastGain;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
    const chip=document.getElementById('chipSc');
    chip.classList.add('bump');setTimeout(function(){chip.classList.remove('bump');},160);
    lastGain=0;
  }
}
function slide(row){
  let a=row.filter(v=>v),out=[],moved=false,merged=[];
  for(let i=0;i<a.length;i++){
    if(a[i]===a[i+1]){
      merged.push(out.length);
      lastGain+=a[i]*2;
      out.push(a[i]*2);score+=a[i]*2;if(a[i]*2>best)best=a[i]*2;
      if(a[i]*2>=2048&&!reached2048){reached2048=true;confettiBurst();}i++;
    }
    else out.push(a[i]);
  }
  while(out.length<4)out.push(0);
  moved=out.some((v,i)=>v!==row[i]);
  return [out,moved,merged];
}
function move(dir){
  if(dead)return;
  const before=JSON.stringify(grid);let moved=false;const mergeCells=[];
  for(let i=0;i<4;i++){
    const horiz=dir==='l'||dir==='r';
    let line=horiz?grid[i].slice():[grid[0][i],grid[1][i],grid[2][i],grid[3][i]];
    if(dir==='r'||dir==='d')line.reverse();
    const [out,m,merged]=slide(line);
    if(dir==='r'||dir==='d')out.reverse();
    for(let j=0;j<4;j++){
      const p=(dir==='r'||dir==='d')?3-j:j;
      if(horiz)grid[i][p]=out[j];else grid[p][i]=out[j];
      if(merged.includes(j)){
        mergeCells.push(horiz?[i,p]:[p,i]);
      }
    }
    moved=moved||m;
  }
  if(!moved||JSON.stringify(grid)===before)return;
  const spawn=add();render(mergeCells,spawn);
  if(!canMove())gameOver();
}
function canMove(){
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){
    if(!grid[i][j])return true;
    if(j<3&&grid[i][j]===grid[i][j+1])return true;
    if(i<3&&grid[i][j]===grid[i+1][j])return true;
  }
  return false;
}
function saveBest(){try{localStorage.setItem("np_2048_best",String(best));}catch(e){}}
function gameOver(){dead=true;saveBest();
  g.classList.add('dead');
  const o=document.createElement('div');o.id='over';
  o.innerHTML=`<h2>${t('over')}</h2><p>${t('overP')(score,Math.max(...grid.flat()))}</p><button onclick="location.reload()">${t('again')}</button>`;
  g.appendChild(o);o.style.display='flex';
}
const K={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',d:'r',w:'u',s:'d'};
addEventListener('keydown',e=>{const k=K[e.key]||K[e.key.toLowerCase&&e.key.toLowerCase()];if(k){e.preventDefault();move(k);}});
/* 统一 pointer 滑动(鼠标+触屏), pointercancel 复位 */
let px0=null,py0=null;
addEventListener('pointerdown',e=>{px0=e.clientX;py0=e.clientY;},{passive:true});
addEventListener('pointerup',e=>{
  if(px0===null)return;
  const dx=e.clientX-px0,dy=e.clientY-py0;px0=null;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));
},{passive:true});
addEventListener('pointercancel',()=>{px0=null;py0=null;},{passive:true});
document.getElementById('again').addEventListener('click',reset);
addEventListener('beforeunload',saveBest);
reset();
</script>
</body>
</html>
