<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a18">
<title>Neon Wordle — Daily Word Game, Free &amp; Unlimited</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <header id="topbar">
    <button id="tab-daily" class="tab on" type="button"></button>
    <button id="tab-free" class="tab" type="button"></button>
    <div id="spacer"></div>
    <div id="streak" class="chip" title="streak">🔥0</div>
    <button id="hardBtn" class="chip tog" type="button" title="hard mode"></button>
    <button id="muteBtn" class="chip tog" type="button" title="sound">🔊</button>
  </header>
  <div id="board"></div>
  <div id="msg" aria-live="polite"></div>
  <div id="keys"></div>
</div>
<div id="endPanel" class="overlay hide">
  <div class="panel">
    <h2 id="epTitle"></h2>
    <div id="epRows"></div>
    <p id="epNote"></p>
    <img id="epCard" alt="result card">
    <button id="epShare" type="button"></button>
    <a id="epSaveCard" download="neon-wordle.png"></a>
    <button id="epNext" type="button"></button>
    <button id="epClose" type="button"></button>
  </div>
</div>
<script src="np_core.js"></script>
<script src="js/words.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
