<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Memory Pairs</title>
<style>
html,body{margin:0;min-height:100%;background:radial-gradient(120% 90% at 50% 0%,#141d42 0%,#0b1020 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:system-ui,sans-serif;color:#e2e8f0;user-select:none;overflow-x:hidden}
#hud{display:flex;gap:10px;margin-bottom:14px}
#hud .chip{background:rgba(20,26,53,.85);border:1px solid #2b3564;border-radius:999px;
  padding:6px 16px;font-size:.95rem;display:flex;gap:6px}
#hud .chip b{color:#c084fc;text-shadow:0 0 8px rgba(192,132,252,.55)}
#grid{position:relative;display:grid;grid-template:repeat(4,1fr)/repeat(4,1fr);gap:10px;
  width:min(92vw,420px);aspect-ratio:1}
.card{position:relative;perspective:700px;cursor:pointer}
.inner{position:absolute;inset:0;transition:transform .45s cubic-bezier(.4,1.4,.6,1);transform-style:preserve-3d}
.card.up .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.6rem,7vw,2.4rem);backface-visibility:hidden}
.back{background:linear-gradient(135deg,#2b1d5e 0%,#1c2450 50%,#0e3a52 100%);
  border:1px solid rgba(167,139,250,.35);box-shadow:inset 0 0 18px rgba(124,58,237,.25)}
.back::after{content:"";position:absolute;inset:0;border-radius:12px;opacity:.5;
  background:repeating-linear-gradient(45deg,transparent 0 8px,rgba(34,211,238,.08) 8px 16px)}
.card:hover .back{box-shadow:0 6px 18px rgba(124,58,237,.4),inset 0 0 18px rgba(124,58,237,.3);
  transform:translateY(-2px)}
.front{transform:rotateY(180deg);border:1px solid rgba(255,255,255,.18)}
.card.done{pointer-events:none}
.card.done .front{box-shadow:0 0 18px currentColor;animation:lockpop .3s ease-out}
@keyframes lockpop{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.12)}100%{transform:rotateY(180deg) scale(1)}}
.card.miss .inner{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.card.deal{animation:deal .4s ease-out backwards}
@keyframes deal{from{opacity:0;transform:translateY(14px) scale(.7)}to{opacity:1;transform:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.spark{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;
  animation:fly .6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(220deg) scale(.2);opacity:0}}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,10,25,.86);backdrop-filter:blur(3px);text-align:center;gap:8px;z-index:10}
#win h2{margin:0;font-size:1.7rem;background:linear-gradient(135deg,#22d3ee,#c084fc);
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
#win p{margin:0;color:#94a3b8}
#win p b{color:#c084fc}
#win button{font:inherit;font-weight:700;min-height:44px;padding:12px 28px;border:0;border-radius:10px;
  background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#0b1020;cursor:pointer;margin-top:10px;
  box-shadow:0 0 16px rgba(34,211,238,.4)}
/* 静音按钮 */
#mute{position:fixed;top:10px;right:10px;z-index:15;font:inherit;font-size:1.1rem;min-height:44px;min-width:44px;
  border:1px solid #2b3564;border-radius:999px;background:rgba(20,26,53,.85);color:#e2e8f0;cursor:pointer}
/* 胜利彩带 */
.cf{position:fixed;top:-4%;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:21;
  animation:cfall 1.1s ease-in forwards}
@keyframes cfall{0%{transform:translate(0,0) rotate(0);opacity:1}
  100%{transform:translate(var(--dx),58vh) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<button id="mute" title="sound">🔊</button>
<div id="hud">
  <div class="chip"><span id="lb-mv">MOVES</span> <b id="mv">0</b></div>
  <div class="chip"><span id="lb-pr">PAIRS</span> <b id="pr">0</b>/8</div>
  <div class="chip"><span id="lb-tm">TIME</span> <b id="tm">0</b>s</div>
</div>
<div id="grid"></div>
<div id="fx"></div>
<div id="win"><h2 id="winT">ALL PAIRS FOUND! 🎉</h2><p id="winP"><b id="fm">0</b> moves · <b id="ft">0</b>s</p><button id="againBtn" onclick="location.reload()">Play again</button></div>
<script src="np_core.js"></script>
<script>
'use strict';
var L={
en:{mv:"MOVES",pr:"PAIRS",tm:"TIME",again:"Play again",winT:"All pairs found!",winP:"{m} moves · {s} s"},
zh:{mv:"步数",pr:"配对",tm:"时间",again:"再来一局",winT:"全部配对成功！",winP:"{m} 步 · {s} 秒"},
es:{mv:"JUGADAS",pr:"PAREJAS",tm:"TIEMPO",again:"Jugar de nuevo",winT:"¡Todas las parejas encontradas!",winP:"{m} jugadas · {s} s"},
pt:{mv:"JOGADAS",pr:"PARES",tm:"TEMPO",again:"Jogar de novo",winT:"Todos os pares encontrados!",winP:"{m} jogadas · {s} s"},
ru:{mv:"ХОДЫ",pr:"ПАРЫ",tm:"ВРЕМЯ",again:"Играть снова",winT:"Все пары найдены!",winP:"{m} ходов · {s} с"},
ja:{mv:"手数",pr:"ペア",tm:"タイム",again:"もう一度遊ぶ",winT:"全ペア発見！",winP:"{m} 手 · {s} 秒"},
ko:{mv:"이동",pr:"짝",tm:"시간",again:"다시 플레이",winT:"모든 짝을 찾았어요!",winP:"{m}번 이동 · {s}초"},
de:{mv:"ZÜGE",pr:"PAARE",tm:"ZEIT",again:"Nochmal spielen",winT:"Alle Paare gefunden!",winP:"{m} Züge · {s} s"},
fr:{mv:"COUPS",pr:"PAIRES",tm:"TEMPS",again:"Rejouer",winT:"Toutes les paires trouvées !",winP:"{m} coups · {s} s"},
id:{mv:"LANGKAH",pr:"PASANGAN",tm:"WAKTU",again:"Main lagi",winT:"Semua pasangan ditemukan!",winP:"{m} langkah · {s} dtk"}};
var _t=function(k){return npT(L,k)};
/* 程序化音效(零文件,首次手势懒恢复) */
var Sound=(function(){
  var ctx=null,master=null,muted=false;
  try{muted=localStorage.getItem("np_mp_mute")==="1";}catch(e){}
  function ensure(){if(ctx)return true;var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    ctx=new AC();master=ctx.createGain();master.gain.value=muted?0:0.4;master.connect(ctx.destination);return true;}
  function resume(){if(ensure()&&ctx.state==="suspended")ctx.resume();}
  function tone(f0,f1,dur,type,vol){if(!ctx||muted)return;try{
    var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}catch(e){}}
  return {resume,isMuted:function(){return muted;},
    toggleMute:function(){muted=!muted;try{localStorage.setItem("np_mp_mute",muted?"1":"0");}catch(e){}if(master)master.gain.value=muted?0:0.4;return muted;},
    flip:function(){tone(360,420,0.06,"triangle",0.22);},
    match:function(){tone(520,880,0.15,"sine",0.28);},
    miss:function(){tone(200,150,0.14,"sawtooth",0.15);},
    win:function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,f,0.16,"triangle",0.3);},i*110);});}};
})();
document.getElementById('lb-mv').textContent=_t('mv');
document.getElementById('lb-pr').textContent=_t('pr');
document.getElementById('lb-tm').textContent=_t('tm');
document.getElementById('againBtn').textContent=_t('again');
var muteBtn=document.getElementById('mute');
muteBtn.textContent=Sound.isMuted()?'🔇':'🔊';
muteBtn.addEventListener('click',function(){muteBtn.textContent=Sound.toggleMute()?'🔇':'🔊';});
const EMO=['🍎','🚀','🐱','🌟','🎧','⚽','🌵','🎲'];
const FC=['linear-gradient(135deg,#0e7490,#22d3ee)','linear-gradient(135deg,#6d28d9,#a78bfa)',
  'linear-gradient(135deg,#be185d,#f472b6)','linear-gradient(135deg,#047857,#4ade80)',
  'linear-gradient(135deg,#b45309,#facc15)','linear-gradient(135deg,#1d4ed8,#60a5fa)',
  'linear-gradient(135deg,#9a3412,#fb923c)','linear-gradient(135deg,#365314,#a3e635)'];
let first=null,lock=false,moves=0,pairs=0,timer=null,sec=0;
function confetti(){
  var cols=["#22d3ee","#f472b6","#ffd54a","#a78bfa","#4ade80"];
  for(var i=0;i<30;i++){
    var f=document.createElement("span");f.className="cf";
    f.style.left=(Math.random()*100)+"%";
    f.style.background=cols[(Math.random()*cols.length)|0];
    f.style.setProperty("--dx",((Math.random()-.5)*90).toFixed(0)+"px");
    f.style.animationDelay=(Math.random()*.4).toFixed(2)+"s";
    document.body.appendChild(f);
    (function(el){setTimeout(function(){el.remove();},1700);})(f);
  }
}
const g=document.getElementById('grid'),fx=document.getElementById('fx');
const deck=[...EMO,...EMO].sort(()=>Math.random()-0.5);
deck.forEach((emo,idx)=>{
  const c=document.createElement('div');c.className='card deal';c.dataset.emo=emo;
  c.style.animationDelay=(idx*45)+'ms';
  const ci=EMO.indexOf(emo);
  c.innerHTML='<div class="inner"><div class="face back"></div><div class="face front" style="background:'+FC[ci]+'">'+emo+'</div></div>';
  c.addEventListener('click',()=>flip(c));
  g.appendChild(c);
});
function startTimer(){
  if(timer)return;
  timer=setInterval(function(){sec++;document.getElementById('tm').textContent=sec;},1000);
}
function burst(el,color){
  var r=el.getBoundingClientRect();
  for(var i=0;i<10;i++){
    var s=document.createElement('span');s.className='spark';
    s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';
    s.style.background=color;
    var a=(i/10)*6.28,d=30+Math.random()*36;
    s.style.setProperty('--dx',Math.cos(a)*d+'px');
    s.style.setProperty('--dy',Math.sin(a)*d+'px');
    fx.appendChild(s);
    setTimeout((function(sp){return function(){sp.remove();};})(s),650);
  }
}
function flip(c){
  if(lock||c.classList.contains('up')||c.classList.contains('done'))return;
  Sound.resume();
  Sound.flip();
  startTimer();
  c.classList.add('up');
  if(!first){first=c;return;}
  moves++;document.getElementById('mv').textContent=moves;
  if(first.dataset.emo===c.dataset.emo){
    var ci=EMO.indexOf(c.dataset.emo);
    first.classList.add('done');c.classList.add('done');
    burst(first,FC[ci]);burst(c,FC[ci]);
    Sound.match();
    first=null;pairs++;document.getElementById('pr').textContent=pairs;
    if(pairs===8){
      if(timer)clearInterval(timer);
      document.getElementById('winT').textContent=_t('winT');
      document.getElementById('winP').innerHTML=_t('winP').replace('{m}',moves).replace('{s}',sec);
      document.getElementById('fm').textContent=moves;
      document.getElementById('ft').textContent=sec;
      Sound.win();confetti();
      setTimeout(function(){document.getElementById('win').style.display='flex';},450);
    }
  }else{
    lock=true;
    Sound.miss();
    var a=first;first=null;
    a.classList.add('miss');c.classList.add('miss');
    setTimeout(function(){
      a.classList.remove('up','miss');c.classList.remove('up','miss');lock=false;
    },700);
  }
}
</script>
</body>
</html>
