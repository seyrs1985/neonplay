<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a18">
<title>Neon Mahjong — Free Mahjong Solitaire</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="topbar">
    <button id="tab-daily" class="tab on"></button>
    <button id="tab-casual" class="tab"></button>
    <button id="tab-standard" class="tab"></button>
    <button id="tab-expert" class="tab"></button>
    <div id="streak" class="chip">🔥 0</div>
  </div>
  <div id="hud">
    <div class="stat"><span class="lb" id="lb-pairs"></span><b id="v-pairs">24</b></div>
    <div class="stat"><span class="lb" id="lb-time"></span><b id="v-time">0:00</b></div>
    <div class="stat"><span class="lb" id="lb-score"></span><b id="v-score">0</b></div>
    <div class="hudbtns">
      <button id="hintBtn" class="pill" aria-label="hint">💡</button>
      <button id="newBtn" class="pill" aria-label="new deal">↻</button>
      <button id="muteBtn" class="pill" aria-label="mute">🔊</button>
    </div>
  </div>
  <div id="board">
    <div id="gridwrap">
      <div id="grid"></div>
      <div id="fx"><svg></svg></div>
    </div>
  </div>
  <div id="msg"></div>
</div>
<div id="winPanel" class="overlay hide">
  <div class="panel">
    <h2 id="wpTitle"></h2>
    <div id="wpRank"></div>
    <div id="wpPerfect" class="hide">★ PERFECT DEAL ★</div>
    <div id="wpRows"></div>
    <div id="wpNext"></div>
    <button id="wpShare"></button>
    <button id="wpNew" class="primary"></button>
  </div>
</div>
<script src="np_core.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
