<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Neon Block Jam</title>
<style>
html,body{margin:0;padding:0;min-height:100%;background:radial-gradient(120% 90% at 50% 0%,#141d42 0%,#0a0a18 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:system-ui,sans-serif;color:#e2e8f0;user-select:none;touch-action:none}
#hud{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
#hud .chip{background:rgba(20,26,53,.85);border:1px solid #2b3564;border-radius:999px;
  padding:5px 14px;font-size:.88rem;display:flex;gap:5px;align-items:center;transition:transform .15s}
#hud .chip.bump{transform:scale(1.14)}
#hud .chip b{color:#22d3ee}
#hud button{font:inherit;font-size:.88rem;font-weight:700;min-height:44px;padding:6px 14px;
  border:1px solid #2b3564;background:rgba(20,26,53,.85);color:#e2e8f0;border-radius:999px;cursor:pointer;
  transition:border-color .15s,box-shadow .2s}
#hud button:hover{border-color:#22d3ee;box-shadow:0 0 10px rgba(34,211,238,.25)}
#board{position:relative;width:min(92vw,420px);aspect-ratio:1;background:rgba(20,26,53,.85);
  border:2px solid rgba(34,211,238,.2);border-radius:14px;overflow:hidden;
  box-shadow:0 0 28px rgba(34,211,238,.1),0 10px 40px rgba(0,0,0,.5);
  background-image:linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);
  background-size:16.666% 16.666%;animation:gridpan 24s linear infinite}
@keyframes gridpan{from{background-position:0 0}to{background-position:16.666% 16.666%}}
#board .gate{position:absolute;pointer-events:none}
#board .cellbg{position:absolute;border-radius:6px;background:rgba(255,255,255,.03)}
.blk{position:absolute;border-radius:8px;cursor:grab;transition:box-shadow .15s;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(.7rem,2vw,.9rem);
  color:rgba(0,0,0,.55);text-shadow:0 1px 0 rgba(255,255,255,.2);
  background-image:linear-gradient(145deg,rgba(255,255,255,.38),rgba(255,255,255,0) 55%);
  box-shadow:0 0 10px currentColor,inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.22)}
.blk.sel{box-shadow:0 0 18px currentColor,0 0 6px currentColor,inset 0 1px 0 rgba(255,255,255,.35);z-index:3;cursor:grabbing;animation:selscale .18s ease-out}
@keyframes selscale{0%{transform:scale(1)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
.blk.invalid{animation:invalid .3s ease}
@keyframes invalid{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,0)}75%{transform:translate(4px,0)}}
.blk.vanish{animation:vanish .35s ease-out forwards;pointer-events:none}
@keyframes vanish{to{transform:scale(0) rotate(90deg);opacity:0}}
/* 碎裂火花 */
.spark{position:absolute;width:5px;height:5px;margin:-2.5px;border-radius:50%;pointer-events:none;z-index:5;
  animation:sparkfly .5s ease-out forwards}
@keyframes sparkfly{0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
.gateglow{position:absolute;pointer-events:none;animation:gatepulse 2s ease-in-out infinite alternate}
@keyframes gatepulse{from{opacity:.5}to{opacity:1}}
#msg{min-height:22px;margin:8px 0;font-size:.9rem;color:#7c8db5;text-align:center}
#stars{color:#facc15;font-size:1.2rem;letter-spacing:2px;min-height:1.4em;text-align:center}
#ctrl{display:flex;gap:8px;margin-bottom:8px}
#ctrl button{font:inherit;font-size:.85rem;padding:8px 16px;min-height:44px;
  border:1px solid #2b3564;background:rgba(20,26,53,.85);color:#e2e8f0;border-radius:999px;cursor:pointer}
#ctrl button:hover{border-color:#22d3ee}
#lvsel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(88vw,320px);margin:10px 0}
#lvsel button{aspect-ratio:1;border-radius:10px;border:1px solid #2b3564;background:rgba(20,26,53,.85);
  color:#e2e8f0;font-size:1rem;font-weight:700;cursor:pointer;position:relative}
#lvsel button:hover{border-color:#22d3ee}
#lvsel button:disabled{opacity:.3;cursor:default}
#lvsel button .st{position:absolute;bottom:2px;left:0;right:0;font-size:.65rem;color:#facc15;text-align:center}
#lvsel button.cur{border-color:#22d3ee;box-shadow:0 0 10px rgba(34,211,238,.3)}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,10,25,.88);backdrop-filter:blur(4px);z-index:20;text-align:center;color:#e2e8f0;
  animation:fadein .4s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#win h2{font-size:1.6rem;margin:0 0 4px;background:linear-gradient(135deg,#22d3ee,#c084fc);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:dropin .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes dropin{from{transform:translateY(-36px) scale(.7);opacity:0}to{transform:none;opacity:1}}
#win .bigstars{font-size:2rem;letter-spacing:4px;margin:6px 0}
#win .bigstars span{display:inline-block;animation:starpop .4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
#win .info{color:#94a3b8;margin-bottom:14px}
#win .btns{display:flex;gap:10px}
#win button{font:inherit;font-weight:700;min-height:44px;padding:10px 22px;border:0;border-radius:10px;
  background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#0b1020;cursor:pointer}
#win button.secondary{background:rgba(20,26,53,.9);color:#e2e8f0;border:1px solid #2b3564}
/* 胜利彩带 */
.cf{position:fixed;top:-4%;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:21;
  animation:cfall 1.1s ease-in forwards}
@keyframes cfall{0%{transform:translate(0,0) rotate(0);opacity:1}
  100%{transform:translate(var(--dx),58vh) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="hud">
  <div class="chip"><span id="lbLv">LEVEL</span> <b id="lv">1</b></div>
  <div class="chip" id="mvChip"><span id="lbMv">MOVES</span> <b id="mv">0</b>/<span id="par">1</span></div>
  <button id="undoBtn">↩ Undo</button>
  <button id="resetBtn">↻ Reset</button>
</div>
<div id="stars"></div>
<div id="board"></div>
<div id="lvsel"></div>
<div id="msg"></div>
<div id="win">
  <h2 id="wtitle">CLEAR!</h2>
  <div class="bigstars" id="wstars"></div>
  <div class="info"><span id="wmv"></span> <span id="lbMvUnit">moves</span> · <span id="lbPar">par</span> <span id="wpar"></span></div>
  <div class="btns">
    <button class="secondary" id="wreplay">↻ Replay</button>
    <button id="wnext">Next →</button>
  </div>
</div>
<script src="np_core.js"></script>
<script>
"use strict";
/* procedural sound (Neon Tide audio.js pattern): synthesized, zero files, lazily resumed on first gesture */
const Sound = (() => {
  let ctx = null, master = null, muted = false;
  try { muted = localStorage.getItem("nbj_mute") === "1"; } catch (e) {}
  function ensure() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(ctx.destination);
    return true;
  }
  function resume() { if (ensure() && ctx.state === "suspended") ctx.resume(); }
  function tone(f0, f1, dur, type, vol) {
    if (!ctx || muted) return;
    try {
      const t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  return {
    resume,
    isMuted: () => muted,
    toggleMute() { muted = !muted; try { localStorage.setItem("nbj_mute", muted ? "1" : "0"); } catch (e) {} if (master) master.gain.value = muted ? 0 : 0.5; return muted; },
    slide()  { tone(300, 380, 0.07, "triangle", 0.25); },
    bad()    { tone(160, 110, 0.12, "sawtooth", 0.18); },
    vanish() { tone(520, 1040, 0.18, "sine", 0.3); },
    win()    { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f, 0.16, "triangle", 0.3), i * 110)); },
  };
})();
const N=6;
/* i18n — np_core.js (np_lang 与站点切换器共用) */
var L={zh:{level:"关卡",moves:"步数",undo:"↩ 撤销",reset:"↻ 重置",clear:"通关！",allClear:"全部通关！",
  replay:"↻ 重玩",next:"下一关 →",mvUnit:"步",parLbl:"目标"},
 en:{level:"LEVEL",moves:"MOVES",undo:"↩ Undo",reset:"↻ Reset",clear:"CLEAR!",allClear:"ALL LEVELS CLEAR!",
  replay:"↻ Replay",next:"Next →",mvUnit:"moves",parLbl:"par"}};
var _t=function(k){return npT(L,k)};
document.getElementById("lbLv").textContent=_t("level");
document.getElementById("lbMv").textContent=_t("moves");
document.getElementById("undoBtn").textContent=_t("undo");
document.getElementById("resetBtn").textContent=_t("reset");
document.getElementById("wreplay").textContent=_t("replay");
document.getElementById("wnext").textContent=_t("next");
document.getElementById("lbMvUnit").textContent=_t("mvUnit");
document.getElementById("lbPar").textContent=_t("parLbl");
/* 碎裂火花: 块中心六向迸发 */
function sparkBurst(xPx,yPx,color){
  var bd=document.getElementById("board");
  for(var i=0;i<8;i++){
    var s=document.createElement("span");s.className="spark";
    s.style.left=xPx+"px";s.style.top=yPx+"px";
    s.style.background=color;s.style.boxShadow="0 0 6px "+color;
    var a=Math.random()*6.28,r=16+Math.random()*20;
    s.style.setProperty("--dx",(Math.cos(a)*r).toFixed(1)+"px");
    s.style.setProperty("--dy",(Math.sin(a)*r).toFixed(1)+"px");
    bd.appendChild(s);(function(el){setTimeout(function(){el.remove();},550);})(s);
  }
}
function chipBump(id){
  var el=document.getElementById(id);
  el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");
  setTimeout(function(){el.classList.remove("bump");},180);
}
function confetti(){
  var cols=["#00e5ff","#ff2d95","#ffd54a","#7c4dff","#39ff88"];
  for(var i=0;i<30;i++){
    var f=document.createElement("span");f.className="cf";
    f.style.left=(Math.random()*100)+"%";
    f.style.background=cols[(Math.random()*cols.length)|0];
    f.style.setProperty("--dx",((Math.random()-.5)*90).toFixed(0)+"px");
    f.style.animationDelay=(Math.random()*.4).toFixed(2)+"s";
    document.body.appendChild(f);
    (function(el){setTimeout(function(){el.remove();},1700);})(f);
  }
}
/* blocks: [color, col, row, w, h] · doors: side T/B/L/R + lane index · 1 move = 1 slide gesture */
const LEVELS=[
 {par:1,doors:{A:[["R",3]]},blocks:[["A",2,3,1,1]]},
 {par:3,doors:{B:[["L",0]],A:[["R",4]]},blocks:[["B",4,4,1,1],["A",1,4,1,1]]},
 {par:3,doors:{A:[["R",1]],B:[["L",3]],C:[["T",2]]},blocks:[["A",0,1,2,1],["B",4,3,1,1],["C",2,4,1,1]]},
 {par:4,doors:{A:[["R",2]],B:[["L",5]],C:[["T",3]]},blocks:[["A",3,2,1,1],["B",4,2,1,1],["C",3,4,1,1]]},
 {par:7,doors:{A:[["T",1]],B:[["B",4]],C:[["L",2]],D:[["R",0]]},blocks:[["A",1,2,1,2],["B",4,4,1,1],["C",3,1,1,1],["D",0,0,1,1]]},
 {par:7,doors:{A:[["R",2]],B:[["T",1]],C:[["B",4]],D:[["T",3]],E:[["B",2]]},blocks:[["A",2,2,1,1],["B",1,1,1,1],["C",2,3,1,1],["D",3,2,1,1],["E",0,1,1,1]]},
 {par:8,doors:{A:[["T",0]],B:[["B",5]],C:[["R",3]],D:[["L",1]],E:[["B",1]]},blocks:[["A",2,2,1,1],["B",4,1,1,1],["C",3,3,1,1],["D",1,4,1,1],["E",0,5,1,1]]},
 {par:11,doors:{A:[["R",1]],B:[["T",5]],C:[["L",3]],D:[["B",0]],E:[["T",2]],F:[["B",3]]},blocks:[["A",3,1,1,1],["B",5,3,1,1],["C",2,4,1,1],["D",0,4,1,1],["E",1,2,1,1],["F",2,3,1,1]]},
 {par:11,doors:{A:[["R",1]],B:[["T",5]],C:[["L",3]],D:[["B",0]],E:[["T",2]],F:[["B",3]]},blocks:[["A",4,1,1,1],["B",5,4,1,1],["C",2,3,1,1],["D",1,4,1,1],["E",1,3,1,1],["F",2,4,1,1]]},
 {par:13,doors:{A:[["R",1]],B:[["T",5]],C:[["L",3]],D:[["B",0]],E:[["T",2]],F:[["B",3]],G:[["B",4]]},blocks:[["A",4,1,1,1],["B",5,4,1,1],["C",2,3,1,1],["D",1,4,1,1],["E",1,3,1,1],["F",2,4,1,1],["G",3,2,1,1]]}
];
const COLORS={A:"#00e5ff",B:"#ff2d95",C:"#ffd54a",D:"#a8ff60",E:"#7c4dff",F:"#ff9e40",G:"#39ff88"};
let curLv=0,blocks,undoStack,moves,selIdx=-1,progress,pendingVanish=false,gen=0;

function loadProgress(){
  try{progress=JSON.parse(localStorage.getItem("np_nbj_progress")||'{"maxLv":0,"stars":{}}');}catch(e){progress={maxLv:0,stars:{}};}
}
function saveProgress(){try{localStorage.setItem("np_nbj_progress",JSON.stringify(progress));}catch(e){}}

function boardPx(){return parseFloat(document.getElementById("board").style.width)||420;}
function cellPx(){return boardPx()/N;}

function gateAt(r,c){
  var lv=LEVELS[curLv];
  for(var col in lv.doors){
    for(var i=0;i<lv.doors[col].length;i++){
      var side=lv.doors[col][i][0],pos=lv.doors[col][i][1];
      if(side==="T"&&r===0&&c===pos)return col;
      if(side==="B"&&r===N-1&&c===pos)return col;
      if(side==="L"&&c===0&&r===pos)return col;
      if(side==="R"&&c===N-1&&r===pos)return col;
    }
  }
  return null;
}
function canMove(blk,dr,dc){
  for(var r=0;r<blk.h;r++)for(var c=0;c<blk.w;c++){
    var nr=blk.row+r+dr,nc=blk.col+c+dc;
    if(nr<0||nr>=N||nc<0||nc>=N)return false;
    var gateHere=gateAt(nr,nc);
    if(gateHere&&gateHere!==blk.color)return false;
    for(var o=0;o<blocks.length;o++){
      var ob=blocks[o];
      if(ob===blk||ob.vanishing)continue;
      if(nr>=ob.row&&nr<ob.row+ob.h&&nc>=ob.col&&nc<ob.col+ob.w)return false;
    }
  }
  return true;
}
/* mark every block sitting on its own gate as vanishing (they exit together) */
function checkVanish(){
  var hit=false;
  blocks.forEach(function(blk){
    if(blk.vanishing)return;
    for(var r=0;r<blk.h;r++)for(var c=0;c<blk.w;c++){
      if(gateAt(blk.row+r,blk.col+c)===blk.color){blk.vanishing=true;hit=true;break;}
    }
  });
  return hit;
}

function render(){
  var bd=document.getElementById("board");
  var px=cellPx();
  bd.innerHTML="";
  var lv=LEVELS[curLv];
  for(var col in lv.doors){
    lv.doors[col].forEach(function(d){
      var side=d[0],pos=d[1];
      var gl=document.createElement("div");gl.className="gateglow";
      var gc=COLORS[col];
      if(side==="T"){gl.style.cssText="left:"+pos*px+"px;top:0;width:"+px+"px;height:6px;background:"+gc+";border-radius:0 0 6px 6px;box-shadow:0 0 12px "+gc;}
      if(side==="B"){gl.style.cssText="left:"+pos*px+"px;bottom:0;width:"+px+"px;height:6px;background:"+gc+";border-radius:6px 6px 0 0;box-shadow:0 0 12px "+gc;}
      if(side==="L"){gl.style.cssText="left:0;top:"+pos*px+"px;width:6px;height:"+px+"px;background:"+gc+";border-radius:0 6px 6px 0;box-shadow:0 0 12px "+gc;}
      if(side==="R"){gl.style.cssText="right:0;top:"+pos*px+"px;width:6px;height:"+px+"px;background:"+gc+";border-radius:6px 0 0 6px;box-shadow:0 0 12px "+gc;}
      bd.appendChild(gl);
    });
  }
  blocks.forEach(function(blk,i){
    var w=blk.w*px-4,h=blk.h*px-4;
    var d=document.createElement("div");d.className="blk";
    if(blk.vanishing){d.classList.add("vanish");d.style.pointerEvents="none";}
    else if(selIdx===i)d.classList.add("sel");
    d.style.left=(blk.col*px+2)+"px";d.style.top=(blk.row*px+2)+"px";
    d.style.width=w+"px";d.style.height=h+"px";
    d.style.background=COLORS[blk.color];
    d.style.color=COLORS[blk.color];
    d.textContent=blk.color;
    d.addEventListener("click",function(e){e.stopPropagation();if(!blk.vanishing)select(i);});
    d.addEventListener("pointerdown",function(e){e.stopPropagation();if(!blk.vanishing){select(i);startDrag(e,i);}});
    bd.appendChild(d);
  });
}
function select(i){selIdx=i;render();}

/* one pointer gesture = at most 1 move (slide any distance along one axis) */
function startDrag(e,i){
  var blk=blocks[i];
  if(!blk||blk.vanishing||pendingVanish)return;
  Sound.resume();
  var startX=e.clientX,startY=e.clientY;
  var counted=false,done=false,myGen=gen;
  var preSnap=JSON.stringify(blocks);
  function mm(ev){
    if(done||myGen!==gen||pendingVanish)return;
    var px=cellPx();
    var dx=ev.clientX-startX,dy=ev.clientY-startY;
    if(!dx&&!dy)return;
    var horiz=Math.abs(dx)>Math.abs(dy);
    var steps=Math.round(horiz?dx/px:dy/px);
    if(!steps)return;
    var dr=horiz?0:(steps>0?1:-1),dc=horiz?(steps>0?1:-1):0;
    var movedAny=false,vanished=false;
    for(var k=0;k<Math.abs(steps);k++){
      if(!canMove(blk,dr,dc)){if(k===0)Sound.bad();break;}
      if(!counted){moves++;counted=true;undoStack.push(preSnap);if(undoStack.length>50)undoStack.shift();Sound.slide();}
      blk.col+=dc;blk.row+=dr;movedAny=true;
      if(checkVanish()){vanished=true;break;}
    }
    if(movedAny){
      document.getElementById("mv").textContent=moves;
      selIdx=blocks.indexOf(blk);
    }
    if(vanished){done=true;selIdx=-1;pendingVanish=true;Sound.vanish();
      sparkBurst((blk.col+blk.w/2)*px,(blk.row+blk.h/2)*px,COLORS[blk.color]);}
    if(movedAny||vanished)render();
    if(movedAny){startX=ev.clientX;startY=ev.clientY;chipBump("mvChip");}
    if(vanished){
      var g=myGen;
      setTimeout(function(){postVanish(g);},350);
    }
  }
  function mu(){document.removeEventListener("pointermove",mm);document.removeEventListener("pointerup",mu);}
  document.addEventListener("pointermove",mm);
  document.addEventListener("pointerup",mu);
}
function postVanish(g){
  if(g!==gen)return;
  blocks=blocks.filter(function(b){return !b.vanishing;});
  pendingVanish=false;
  render();
  if(blocks.length===0){
    Sound.win();
    var par=LEVELS[curLv].par;
    var st=moves<=par?3:moves<=par+2?2:1;
    progress.stars[curLv]=Math.max(progress.stars[curLv]||0,st);
    if(curLv+1>progress.maxLv)progress.maxLv=curLv+1;
    saveProgress();
    var last=curLv+1>=LEVELS.length;
    document.getElementById("wtitle").textContent=last?_t("allClear"):_t("clear");
    document.getElementById("wnext").style.display=last?"none":"";
    document.getElementById("wstars").innerHTML="";
    for(var si=0;si<3;si++){
      var sp=document.createElement("span");
      sp.textContent=si<st?"★":"☆";
      sp.style.animationDelay=(0.15+si*0.18).toFixed(2)+"s";
      sp.style.color=si<st?"#facc15":"";
      document.getElementById("wstars").appendChild(sp);
    }
    document.getElementById("wmv").textContent=moves;
    document.getElementById("wpar").textContent=par;
    document.getElementById("win").style.display="flex";
    confetti();
    renderLevelSel();
  }
}
function undo(){
  if(pendingVanish||!undoStack.length)return;
  blocks=JSON.parse(undoStack.pop());moves=Math.max(0,moves-1);selIdx=-1;
  document.getElementById("mv").textContent=moves;
  render();
}
/* keyboard: arrows slide the selected block 1 cell per press, U undo, R reset */
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="u"||k==="U"){undo();return;}
  if(k==="r"||k==="R"){loadLevel(curLv);return;}
  if(pendingVanish)return;
  var dir={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[k];
  if(!dir)return;
  var blk=blocks[selIdx];
  if(!blk||blk.vanishing)return;
  e.preventDefault();
  if(!canMove(blk,dir[0],dir[1])){Sound.bad();return;}
  undoStack.push(JSON.stringify(blocks));if(undoStack.length>50)undoStack.shift();
  moves++;blk.col+=dir[1];blk.row+=dir[0];Sound.slide();
  var v=checkVanish();
  document.getElementById("mv").textContent=moves;
  chipBump("mvChip");
  if(v){selIdx=-1;pendingVanish=true;Sound.vanish();var g=gen;render();setTimeout(function(){postVanish(g);},350);}
  else render();
});
function loadLevel(n){
  curLv=n;moves=0;selIdx=-1;undoStack=[];pendingVanish=false;gen++;
  blocks=LEVELS[n].blocks.map(function(b){
    return{color:b[0],col:b[1],row:b[2],w:b[3],h:b[4]};
  });
  document.getElementById("lv").textContent=n+1;
  document.getElementById("par").textContent=LEVELS[n].par;
  document.getElementById("mv").textContent="0";
  document.getElementById("stars").textContent="";
  document.getElementById("msg").textContent="";
  document.getElementById("win").style.display="none";
  renderLevelSel();
  render();
}
function renderLevelSel(){
  var el=document.getElementById("lvsel");el.innerHTML="";
  for(var i=0;i<LEVELS.length;i++){
    var b=document.createElement("button");
    b.textContent=i+1;
    var st=progress.stars[i]||0;
    if(st)b.innerHTML=(i+1)+'<div class="st">'+"★".repeat(st)+"</div>";
    if(i===curLv)b.classList.add("cur");
    if(i>progress.maxLv){b.disabled=true;}
    b.addEventListener("click",function(n){return function(){loadLevel(n);};}(i));
    el.appendChild(b);
  }
}
document.getElementById("undoBtn").addEventListener("click",undo);
document.getElementById("resetBtn").addEventListener("click",function(){loadLevel(curLv);});
document.getElementById("wreplay").addEventListener("click",function(){loadLevel(curLv);});
document.getElementById("wnext").addEventListener("click",function(){
  if(curLv+1<LEVELS.length)loadLevel(curLv+1);else document.getElementById("win").style.display="none";
});
document.getElementById("board").addEventListener("click",function(e){
  if(e.target===this){selIdx=-1;render();}
});
loadProgress();
loadLevel(Math.min(progress.maxLv,LEVELS.length-1));
renderLevelSel();
/* QA hook (GAME_STANDARD §四) */
window.__qaState = function(){ return { level: curLv+1, moves: moves, blocksLeft: blocks.length, winShown: document.getElementById("win").style.display === "flex" }; };
</script>
