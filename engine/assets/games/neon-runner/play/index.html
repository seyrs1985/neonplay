<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a18">
<title>Neon Runner — Cyber Endless Runner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="chip"><span class="lb" id="lb-dist"></span><b id="v-dist">0</b><span class="unit">m</span></div>
    <div class="chip"><span class="lb" id="lb-speed"></span><b id="v-speed">340</b></div>
    <div class="chip"><span class="lb" id="lb-best"></span><b id="v-best">—</b></div>
    <button id="muteBtn" class="pill" aria-label="mute">🔊</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="zoneL" class="zone">JUMP</div>
    <div id="zoneR" class="zone">DUCK</div>
    <div id="panel"><div id="panelBox"></div></div>
  </div>
</div>
<script src="np_core.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
